name: desktop

on:
  push:
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'assets/**'
      - 'index.html'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: desktop
      - name: Smoke test (Electron, xvfb)
        run: xvfb-run -a npm test
        working-directory: desktop

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --mac --x64 --arm64
            artifact: labtools-macos
          - os: windows-2022
            args: --win --x64
            artifact: labtools-windows
          - os: ubuntu-latest
            args: --linux --x64
            artifact: labtools-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: desktop
      - name: Package
        run: npm run dist -- ${{ matrix.args }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
