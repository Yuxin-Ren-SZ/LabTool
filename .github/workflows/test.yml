name: tests

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  fixtures-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fixtures up to date
        run: node scripts/gen-fixtures.mjs --check
      - name: Unit tests
        # Unquoted so the shell expands the glob — works regardless of whether
        # the node version supports `--test` glob patterns natively.
        run: node --test tests/unit/*.test.mjs
      - name: JS syntax check (shared + tool scripts)
        run: |
          node --check assets/js/labtools-workbench.js
          node --check assets/js/labtools-calc.js
          node --check assets/js/labtools-common.js
          node --check tools/thermal-to-laser/tool.js
          node --check tools/drug-dosage/tool.js

  e2e:
    # Headless-Chromium integration suite (tests/e2e). Pinned to 22.04 for
    # stable apt package names for Chromium's shared libraries.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies (puppeteer downloads Chrome)
        run: npm ci
      - name: Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2
      - name: e2e tests
        run: npm run test:e2e
