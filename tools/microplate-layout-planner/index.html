  els.viewAllBtn = document.getElementById('view-all-btn');
  els.legendList = document.getElementById('legend-list');
  els.importCsvInput = document.getElementById('import-csv-input');
  els.statusLine = document.getElementById('status-line');
  els.printSummary = document.getElementById('print-summary');
  els.printLegend = document.getElementById('print-legend');
}

function setupLayoutObservers() {
  if (typeof ResizeObserver === 'function') {
    plateFrameObserver = new ResizeObserver(() => renderPlateFrameCorners());
    plateFrameObserver.observe(els.plateFrame);
  }

  window.addEventListener('resize', schedulePlateRender, { passive: true });
  window.addEventListener('beforeprint', () => { renderOverview(); syncPlateRender(); });
  window.addEventListener('afterprint', syncPlateRender);
}

function schedulePlateRender() {
  if (plateRenderRaf) return;
  plateRenderRaf = window.requestAnimationFrame(() => {
    plateRenderRaf = 0;
    renderPlate();
  });
}

function syncPlateRender() {
  if (plateRenderRaf) {
    window.cancelAnimationFrame(plateRenderRaf);
    plateRenderRaf = 0;
  }
  renderPlate();
}

/**
 * Arrow-key navigation across well buttons (roving focus on the grid).
 * Moves focus to the adjacent well when present; coordinates come from the
 * button's data-row/data-col attributes set by createWellButton.
 */
function onPlateGridKeydown(event) {
  const btn = event.target.closest('.well');
  if (!btn) return;
  let nr = parseInt(btn.dataset.row, 10);
  let nc = parseInt(btn.dataset.col, 10);
  if (event.key === 'ArrowUp') nr--;
  else if (event.key === 'ArrowDown') nr++;
  else if (event.key === 'ArrowLeft') nc--;
  else if (event.key === 'ArrowRight') nc++;
  else return;
  const next = els.plateGrid.querySelector(`.well[data-row="${nr}"][data-col="${nc}"]`);
  if (next) { event.preventDefault(); next.focus(); }
}

function wireEvents() {
  els.plateType.addEventListener('change', onPlateTypeChange);
  els.plateGrid.addEventListener('pointerdown', onPlatePointerDown);
  els.plateGrid.addEventListener('pointerover', onPlatePointerOver);
  els.plateGrid.addEventListener('keydown', onPlateGridKeydown);
  document.addEventListener('pointerup', endDragSelection);
  document.addEventListener('keydown', onDocumentKeyDown);

  els.assignBtn.addEventListener('click', applyActiveFieldToSelection);
  els.clearBtn.addEventListener('click', clearSelectedWells);
  els.copyBtn.addEventListener('click', copySelectedWells);
  els.pasteBtn.addEventListener('click', pasteClipboardAtSelection);
  els.addFieldBtn.addEventListener('click', addFieldFromInput);
  els.newFieldName.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') addFieldFromInput();
  });
  els.colorBy.addEventListener('change', () => { colorFieldId = els.colorBy.value; renderAll(); });
  els.labelBy.addEventListener('change', () => { labelFieldId = els.labelBy.value; renderPlate(); renderMaybeOverview(); });
  els.viewAllBtn.addEventListener('click', toggleOverview);
  document.getElementById('import-csv-btn').addEventListener('click', () => els.importCsvInput.click());
  els.importCsvInput.addEventListener('change', onImportCsvFile);
  document.getElementById('export-csv-btn').addEventListener('click', exportCsv);
  document.getElementById('export-png-btn').addEventListener('click', exportPng);
  document.getElementById('print-btn').addEventListener('click', () => window.print());
  document.getElementById('reset-btn').addEventListener('click', resetPlate);
}

function renderPlateOptions() {
  els.plateType.innerHTML = Object.keys(PLATE_REFERENCE_MM).map((key) => {
    const plate = PLATE_REFERENCE_MM[key];
    const selected = key === AP().plateType ? ' selected' : '';
    return `<option value="${key}"${selected}>${plate.label} (${plate.rows} x ${plate.cols})</option>`;
  }).join('');
}

function renderCornerToggles() {
  const cutCorners = AP().cutCorners;
  els.cornerToggles.innerHTML = CORNERS.map((corner) => {
    const checked = cutCorners.has(corner.id) ? ' checked' : '';
    return `
      <label class="corner-toggle" title="${cornerLabel(corner.id)} corner">
        <input type="checkbox" data-corner="${corner.id}"${checked} />
        <span>${corner.label}</span>
      </label>`;
  }).join('');

  els.cornerToggles.querySelectorAll('input[data-corner]').forEach((input) => {
    input.addEventListener('change', () => {
      if (input.checked) AP().cutCorners.add(input.dataset.corner);
      else AP().cutCorners.delete(input.dataset.corner);
      renderPlateFrameCorners();
      renderPrintSummary();
    });
  });
}

function renderAll() {
  renderPlateTabs();
  renderPlate();
  renderFields();
  renderLegend();
  renderSelectionState();
  renderPrintSummary();
  renderMaybeOverview();
}

// ── Plate tabs ───────────────────────────────────────────────────────────────
function renderPlateTabs() {
  els.plateTabs.innerHTML = '';
  plates.forEach((plate) => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = `plate-tab${plate.id === activePlateId ? ' active' : ''}`;
    tab.title = 'Click to edit · double-click to rename';
    tab.innerHTML = `<span>${labtoolsEscapeHtml(plate.name)}</span><span class="plate-tab-size">${plate.plateType}w</span>` +
      (plates.length > 1 ? '<span class="plate-tab-remove" title="Remove plate">&times;</span>' : '');
    tab.addEventListener('click', (event) => {
      if (event.target.classList.contains('plate-tab-remove')) { removePlate(plate.id); return; }
      switchToPlate(plate.id);
    });
    tab.addEventListener('dblclick', () => renamePlate(plate.id));
    els.plateTabs.appendChild(tab);
  });
  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'plate-tab-add';
  add.textContent = '+ Add plate';
  add.addEventListener('click', addPlate);
  els.plateTabs.appendChild(add);
}

function toggleOverview() {
  overviewMode = !overviewMode;
  document.body.classList.toggle('overview', overviewMode);
  els.viewAllBtn.textContent = overviewMode ? 'Edit Plate' : 'View All';
  if (overviewMode) renderOverview();
  else renderPlate();
}

function renderMaybeOverview() {
  if (overviewMode) renderOverview();
}

function renderPlate() {
  const plateType = AP().plateType;
  const plate = PLATE_REFERENCE_MM[plateType];
  const metrics = getPlateMetrics(plate);
  currentPlatePxPerMm = metrics.pxPerMm;
  els.plateGrid.dataset.plate = plateType;
  els.plateGrid.dataset.labelMode = getLabelMode(metrics.wellDiameterPx);
  els.plateFrame.style.width = px(metrics.frameWidthPx);
  els.plateFrame.style.height = px(metrics.frameHeightPx);
  els.plateGrid.style.setProperty('--well-id-size', px(metrics.wellIdFontPx));
  els.plateGrid.style.setProperty('--well-label-size', px(metrics.wellLabelFontPx));
  els.plateGrid.style.setProperty('--well-initials-size', px(metrics.wellInitialsFontPx));
  els.plateGrid.style.setProperty('--axis-label-font', px(metrics.axisLabelFontPx));
  els.plateGrid.innerHTML = '';

  for (let col = 0; col < plate.cols; col++) {
    els.plateGrid.appendChild(createColumnButton(plate, metrics, col));
  }

  for (let row = 0; row < plate.rows; row++) {
    els.plateGrid.appendChild(createRowButton(plate, metrics, row));

    for (let col = 0; col < plate.cols; col++) {
      els.plateGrid.appendChild(createWellButton(plate, metrics, row, col));
    }
  }

  els.plateSummary.textContent = `${plate.rows * plate.cols} wells`;
  renderPlateFrameCorners();
}

function createColumnButton(plate, metrics, col) {
  const button = document.createElement('button');
  button.className = 'axis-cell axis-cell--col';
  button.type = 'button';
  button.textContent = String(col + 1);
  button.title = `Select column ${col + 1}`;
  button.style.left = px(getWellCenterXPx(plate, metrics, col));
  button.style.top = px(metrics.colLabelCenterYpx);
  button.style.width = px(metrics.columnHeaderWidthPx);
  button.style.height = px(metrics.headerHeightPx);
  button.addEventListener('click', () => selectColumn(col));
  return button;
}

function createRowButton(plate, metrics, row) {
  const button = document.createElement('button');
  button.className = 'axis-cell axis-cell--row';
  button.type = 'button';
  button.textContent = rowLabel(row);
  button.title = `Select row ${rowLabel(row)}`;
  button.style.left = px(metrics.rowLabelCenterXpx);
  button.style.top = px(getWellCenterYPx(plate, metrics, row));
  button.style.width = px(metrics.rowHeaderWidthPx);
  button.style.height = px(metrics.headerHeightPx);
  button.addEventListener('click', () => selectRow(row));
  return button;
}

function createWellButton(plate, metrics, row, col) {
  const ap = AP();
  const wellId = getWellId(row, col);
  const color = colorForWell(ap, wellId);
  const labelText = labelForWell(ap, wellId);
  const button = document.createElement('button');
  button.className = 'well';
  button.type = 'button';
  button.dataset.well = wellId;
  button.dataset.row = String(row);
  button.dataset.col = String(col);
  button.dataset.shape = plate.shape || 'round';
  button.setAttribute('aria-label', labelText ? `${wellId}, ${labelText}` : `${wellId}, unassigned`);
  button.style.setProperty('--well-size', px(metrics.wellDiameterPx));
  button.style.setProperty('--well-x', px(getWellCenterXPx(plate, metrics, col)));
  button.style.setProperty('--well-y', px(getWellCenterYPx(plate, metrics, row)));
  button.innerHTML = `
    <span class="well-id">${wellId}</span>
    <span class="well-label">${labtoolsEscapeHtml(labelText)}</span>
    <span class="well-initials">${labtoolsEscapeHtml(groupInitials(labelText))}</span>
  `;

  if (color) {
    button.classList.add('assigned');
    button.style.setProperty('--well-color', color);
    button.style.setProperty('--well-text', contrastText(color));
  }
  if (labelText) button.classList.add('has-label');
  if (selectedWells.has(wellId)) button.classList.add('selected');
  return button;
}

function renderPlateFrameCorners() {
  const width = Math.round(els.plateFrame.clientWidth);
  const height = Math.round(els.plateFrame.clientHeight);
  if (!width || !height) return;

  const cutSize = getPlateCutSize(width, height);
  const points = buildPlateFramePoints(width, height, cutSize, AP().cutCorners);
  const polygon = points.map(([x, y]) => `${x}px ${y}px`).join(', ');
  const pathData = points.map(([x, y], index) => `${index === 0 ? 'M' : 'L'}${x} ${y}`).join(' ') + ' Z';

  els.plateShell.style.clipPath = `polygon(${polygon})`;
  els.plateOutline.setAttribute('viewBox', `0 0 ${width} ${height}`);
  els.plateOutline.setAttribute('preserveAspectRatio', 'none');
  els.plateOutlinePath.setAttribute('d', pathData);
}

function getPlateCutSize(width, height) {
  const requested = PLATE_UI_MM.cornerCutMm * currentPlatePxPerMm;
  const safeMax = Math.max(18, Math.min((width / 2) - 8, (height / 2) - 8));
  return Math.round(Math.min(requested, safeMax));
}

function buildPlateFramePoints(width, height, cutSize, cutCorners) {
  const points = [];
  const hasTopLeft = cutCorners.has('top-left');
  const hasTopRight = cutCorners.has('top-right');
  const hasBottomRight = cutCorners.has('bottom-right');
  const hasBottomLeft = cutCorners.has('bottom-left');

  points.push(hasTopLeft ? [cutSize, 0] : [0, 0]);

  if (hasTopRight) {
    points.push([width - cutSize, 0], [width, cutSize]);
  } else {
    points.push([width, 0]);
  }

  if (hasBottomRight) {
    points.push([width, height - cutSize], [width - cutSize, height]);
  } else {
    points.push([width, height]);
  }

  if (hasBottomLeft) {
    points.push([cutSize, height], [0, height - cutSize]);
  } else {
    points.push([0, height]);
  }

  if (hasTopLeft) points.push([0, cutSize]);
  return points;
}

// ── Field manager + value editor ─────────────────────────────────────────────
function renderFields() {
  els.colorBy.innerHTML = categoryFields().map((f) =>
    `<option value="${f.id}"${f.id === colorFieldId ? ' selected' : ''}>${labtoolsEscapeHtml(f.name)}</option>`).join('');
  els.labelBy.innerHTML = fields.map((f) =>
    `<option value="${f.id}"${f.id === labelFieldId ? ' selected' : ''}>${labtoolsEscapeHtml(f.name)}</option>`).join('');

  els.fieldList.innerHTML = '';
  fields.forEach((field) => {
    const row = document.createElement('div');
    row.className = `field-row${field.id === activeFieldId ? ' active' : ''}`;
    row.dataset.fieldId = field.id;
    const lastCategory = field.kind === 'category' && categoryFields().length === 1;
    row.innerHTML = `
      <span class="field-kind" title="${field.kind === 'category' ? 'Category (colored values)' : 'Free text'}">${field.kind === 'category' ? 'Cat' : 'Txt'}</span>
      <input class="field-name" type="text" maxlength="32" value="${labtoolsEscapeHtml(field.name)}" aria-label="Field name" />
      <button class="group-delete" type="button" title="Delete field" ${lastCategory ? 'disabled' : ''}>&times;</button>
    `;
    row.addEventListener('click', (event) => {
      if (event.target.classList.contains('group-delete') || event.target.classList.contains('field-name')) return;
      setActiveField(field.id);
    });
    const nameInput = row.querySelector('.field-name');
    nameInput.addEventListener('focus', () => setActiveField(field.id));
    nameInput.addEventListener('input', (event) => {
      field.name = event.target.value.trim() || 'Field';
      // Keep the color/label selectors and the value-editor title in sync with
      // the renamed field (plate/legend/print were the only views refreshed).
      const cOpt = els.colorBy.querySelector(`option[value="${field.id}"]`);
      if (cOpt) cOpt.textContent = field.name;
      const lOpt = els.labelBy.querySelector(`option[value="${field.id}"]`);
      if (lOpt) lOpt.textContent = field.name;
      if (activeFieldId === field.id) renderValueEditor();
      renderPlate(); renderLegend(); renderPrintSummary();
    });
    if (!lastCategory) row.querySelector('.group-delete').addEventListener('click', () => deleteField(field.id));
    els.fieldList.appendChild(row);
  });

  renderValueEditor();
}

function renderValueEditor() {
  const field = getField(activeFieldId) || fields[0];
  els.valueEditor.innerHTML = '';
  if (!field) return;
  const title = document.createElement('div');
  title.className = 'lt-section-label lt-section-label--tight';
  title.textContent = `${field.name} value`;
  els.valueEditor.appendChild(title);

  if (field.kind === 'category') {
    const create = document.createElement('div');
    create.className = 'group-create';
    create.innerHTML = `<input class="lt-input" id="new-cat-name" type="text" maxlength="32" placeholder="${labtoolsEscapeHtml(field.name)} value" /><button class="btn-reset" type="button" id="add-cat-btn">Add</button>`;
    els.valueEditor.appendChild(create);

    const list = document.createElement('div');
    list.className = 'group-list';
    cats(field.id).forEach((cat) => {
      const row = document.createElement('div');
      row.className = `group-row${activeCatByField[field.id] === cat.id ? ' active' : ''}`;
      row.dataset.catId = cat.id;
      row.innerHTML = `
        <button class="group-swatch" type="button" title="Set active value"></button>
        <input class="group-name" type="text" maxlength="32" value="${labtoolsEscapeHtml(cat.name)}" aria-label="Value name" />
        <button class="group-delete" type="button" title="Delete value">&times;</button>`;
      row.querySelector('.group-swatch').style.background = cat.color;
      row.addEventListener('click', (event) => {
        if (event.target.classList.contains('group-delete') || event.target.classList.contains('group-name')) return;
        setActiveCategory(field.id, cat.id);
      });
      row.querySelector('.group-name').addEventListener('input', (event) => {
        cat.name = event.target.value.trim() || 'Value';
        renderPlate(); renderLegend(); renderPrintSummary();
      });
      row.querySelector('.group-name').addEventListener('focus', () => setActiveCategory(field.id, cat.id));
      row.querySelector('.group-delete').addEventListener('click', () => deleteCategory(field.id, cat.id));
      list.appendChild(row);
    });
    els.valueEditor.appendChild(list);
    create.querySelector('#add-cat-btn').addEventListener('click', () => addCategoryFromInput(field.id));
    create.querySelector('#new-cat-name').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addCategoryFromInput(field.id);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'value-text-row';
    row.innerHTML = `<input class="lt-input" id="text-value" type="text" maxlength="60" placeholder="${labtoolsEscapeHtml(field.name)} for selected wells" /><button class="lt-btn lt-btn-primary" type="button" id="apply-text-btn">Apply</button>`;
    els.valueEditor.appendChild(row);
    row.querySelector('#apply-text-btn').addEventListener('click', applyActiveFieldToSelection);
    row.querySelector('#text-value').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') applyActiveFieldToSelection();
    });
  }
}

function renderLegend() {
  const field = getField(colorFieldId);
  const infos = assignedCategoryInfo(colorFieldId, [AP()]);
  if (infos.length === 0) {
    els.legendList.innerHTML = `<div class="lt-alert lt-alert-info">No assigned ${labtoolsEscapeHtml(field ? field.name : 'values')}.</div>`;
    return;
  }
  els.legendList.innerHTML = '';
  infos.forEach((info) => {
    const abbreviation = info.abbreviationUsed
      ? `<span class="legend-abbrev">${labtoolsEscapeHtml(info.abbreviation)}</span>`
      : '';
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <span><span class="group-swatch" style="background:${info.color}"></span> ${labtoolsEscapeHtml(info.name)}${abbreviation}</span>
      <span class="legend-count">${info.count}</span>
    `;
    els.legendList.appendChild(row);
  });
}

function countWellsWithValue(plate, fieldId, value) {
  let n = 0;
  for (const w in plate.assignments) if (plate.assignments[w][fieldId] === value) n += 1;
  return n;
}

function assignedCategoryInfo(fieldId, platesList, labelMode = getCurrentLabelMode()) {
  return cats(fieldId).map((cat) => {
    const count = platesList.reduce((sum, plate) => sum + countWellsWithValue(plate, fieldId, cat.id), 0);
    const abbreviation = groupInitials(cat.name);
    return {
      id: cat.id, name: cat.name, color: cat.color, abbreviation,
      abbreviationUsed: labelMode === 'compact' && abbreviation !== '', count,
    };
  }).filter((info) => info.count > 0);
}

function renderSelectionState() {
  els.selectedCount.textContent = String(selectedWells.size);
  els.clipboardCount.textContent = clipboard ? String(clipboard.cells.length) : '0';
  els.assignBtn.disabled = selectedWells.size === 0;
  els.clearBtn.disabled = selectedWells.size === 0;
  els.copyBtn.disabled = selectedWells.size === 0;
  els.pasteBtn.disabled = !clipboard;
}

function renderPrintSummary() {
  const lines = plates.map((plate) => {
    const ref = PLATE_REFERENCE_MM[plate.plateType];
    const corners = Array.from(plate.cutCorners).map(cornerLabel).join(', ') || 'none';
    const used = Object.keys(plate.assignments).length;
    return `<strong>${labtoolsEscapeHtml(plate.name)}</strong> — ${ref.label}, ${ref.rows} x ${ref.cols}; ${used} labelled wells; corner marks: ${labtoolsEscapeHtml(corners)}.`;
  }).join('<br>');
  els.printSummary.innerHTML = lines;
  renderPrintLegend();
}

function renderPrintLegend() {
  const field = getField(colorFieldId);
  const infos = assignedCategoryInfo(colorFieldId, plates, 'compact');
  if (infos.length === 0) {
    els.printLegend.innerHTML = '';
    return;
  }

  const rows = infos.map((info) => {
    const abbreviation = info.abbreviationUsed
      ? `<span class="print-legend-abbrev">${labtoolsEscapeHtml(info.abbreviation)} =</span>`
      : '';
    return `
      <div class="print-legend-item">
        <span class="print-legend-swatch" style="background:${info.color}"></span>
        ${abbreviation}
        <span class="print-legend-name">${labtoolsEscapeHtml(info.name)}</span>
        <span class="print-legend-count">(${info.count})</span>
      </div>`;
  }).join('');

  els.printLegend.innerHTML = `
    <div class="print-legend-title">${labtoolsEscapeHtml(field ? field.name : 'Legend')} Legend</div>
    <div class="print-legend-grid">${rows}</div>
  `;
}

function onPlateTypeChange() {
  AP().plateType = els.plateType.value;
  trimAssignmentsAndSelectionToPlate();
  renderAll();
  setStatus(`Set ${AP().name} to ${PLATE_REFERENCE_MM[AP().plateType].label}.`, 'info');
}

function onPlatePointerDown(event) {
  const well = event.target.closest('.well');
  if (!well) return;
  event.preventDefault();
  const position = wellPosition(well.dataset.well);

  if (event.shiftKey && selectionAnchor) {
    selectRectangle(wellPosition(selectionAnchor), position);
    return;
  }

  if (event.metaKey || event.ctrlKey) {
    toggleWellSelection(well.dataset.well);
    selectionAnchor = well.dataset.well;
    return;
  }

  dragState = { start: position };
  selectionAnchor = well.dataset.well;
  selectedWells = new Set([well.dataset.well]);
  renderSelectionOnly();
}

function onPlatePointerOver(event) {
  if (!dragState) return;
  const well = event.target.closest('.well');
  if (!well) return;
  selectRectangle(dragState.start, wellPosition(well.dataset.well), false);
}

function endDragSelection() {
  dragState = null;
}

function onDocumentKeyDown(event) {
  const tag = event.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'c') {
    event.preventDefault();
    copySelectedWells();
  } else if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'v') {
    event.preventDefault();
    pasteClipboardAtSelection();
  } else if (event.key === 'Delete' || event.key === 'Backspace') {
    if (selectedWells.size > 0) {
      event.preventDefault();
      clearSelectedWells();
    }
  } else if (event.key === 'Escape') {
    selectedWells.clear();
    renderSelectionOnly();
    setStatus('Selection cleared.', 'info');
  }
}

function selectRow(row) {
  const plate = PLATE_REFERENCE_MM[AP().plateType];
  selectedWells = new Set();
  for (let col = 0; col < plate.cols; col++) {
    selectedWells.add(getWellId(row, col));
  }
  selectionAnchor = getWellId(row, 0);
  renderSelectionOnly();
}

function selectColumn(col) {
  const plate = PLATE_REFERENCE_MM[AP().plateType];
  selectedWells = new Set();
  for (let row = 0; row < plate.rows; row++) {
    selectedWells.add(getWellId(row, col));
  }
  selectionAnchor = getWellId(0, col);
  renderSelectionOnly();
}

function selectRectangle(start, end, announce = true) {
  const minRow = Math.min(start.row, end.row);
  const maxRow = Math.max(start.row, end.row);
  const minCol = Math.min(start.col, end.col);
  const maxCol = Math.max(start.col, end.col);
  selectedWells = new Set();
  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      selectedWells.add(getWellId(row, col));
    }
  }
  if (announce) setStatus(`${selectedWells.size} wells selected.`, 'info');
  renderSelectionOnly();
}

function toggleWellSelection(wellId) {
  if (selectedWells.has(wellId)) selectedWells.delete(wellId);
  else selectedWells.add(wellId);
  renderSelectionOnly();
}

function renderSelectionOnly() {
  els.plateGrid.querySelectorAll('.well').forEach((well) => {
    well.classList.toggle('selected', selectedWells.has(well.dataset.well));
  });
  renderSelectionState();
}

function getPlateMetrics(plate) {
  const available = getAvailableFrameSpacePx();
  const pxPerMm = clamp(
    Math.min(
      available.width / PLATE_UI_MM.outerWidth,
      available.height / PLATE_UI_MM.outerHeight
    ),
    PLATE_SCALE_LIMITS.min,
    PLATE_SCALE_LIMITS.max
  );
  const frameWidthPx = mmToPx(PLATE_UI_MM.outerWidth, pxPerMm);
  const frameHeightPx = mmToPx(PLATE_UI_MM.outerHeight, pxPerMm);

  const pitchPx = plate.pitchMm * pxPerMm;
  const wellDiameterPx = plate.wellDiameterMm * pxPerMm;
  const wellRadiusPx = wellDiameterPx / 2;
  const gridOffsetXpx = plate.a1ColOffsetMm * pxPerMm;
  const gridOffsetYpx = plate.a1RowOffsetMm * pxPerMm;
  const colLabelBandPx = Math.max(gridOffsetYpx - wellRadiusPx, PLATE_UI_MM.colLabelBandMm * pxPerMm);
  const rowLabelBandPx = Math.max(gridOffsetXpx - wellRadiusPx, PLATE_UI_MM.rowLabelBandMm * pxPerMm);

  const colLabelCenterYpx = Math.max(8, colLabelBandPx / 2);
  const rowLabelCenterXpx = Math.max(8, rowLabelBandPx / 2);

  const headerHeightPx = clamp(Math.min(pitchPx * 0.72, colLabelBandPx * 0.9), 10, 26);
  const columnHeaderWidthPx = clamp(pitchPx * 0.9, 16, 36);
  const rowHeaderWidthPx = clamp(rowLabelBandPx * 0.85, 14, 34);

  return {
    frameWidthPx,
    frameHeightPx,
    pxPerMm,
    pitchPx,
    wellDiameterPx,
    gridOffsetXpx,
    gridOffsetYpx,
    colLabelCenterYpx,
    rowLabelCenterXpx,
    headerHeightPx,
    columnHeaderWidthPx,
    rowHeaderWidthPx,
    axisLabelFontPx: clamp(pxPerMm * 2.2, 9, 13),
    wellIdFontPx: clamp(wellDiameterPx * 0.18, 8.5, 18),
    wellLabelFontPx: clamp(wellDiameterPx * 0.11, 7, 15),
    wellInitialsFontPx: clamp(wellDiameterPx * 0.2, 8.5, 16),
  };
}

function getAvailableFrameSpacePx() {
  const minWidthPx = PLATE_UI_MM.outerWidth * PLATE_SCALE_LIMITS.min;
  const minHeightPx = PLATE_UI_MM.outerHeight * PLATE_SCALE_LIMITS.min;
  const workspace = els.plateStage.parentElement;
  const workspaceStyle = getComputedStyle(workspace);
  const workspaceGap = parseFloat(workspaceStyle.columnGap || workspaceStyle.gap) || 0;
  const isStacked = workspaceStyle.flexDirection === 'column';
  const sidePanel = workspace.querySelector('.side-panel');
  const sidePanelWidth = isStacked || !sidePanel ? 0 : sidePanel.getBoundingClientRect().width + workspaceGap;
  const pageBody = workspace.closest('.lt-page-body');
  const pageBodyStyle = pageBody ? getComputedStyle(pageBody) : null;
  const pageInsetX = pageBodyStyle
    ? (parseFloat(pageBodyStyle.paddingLeft) || 0) + (parseFloat(pageBodyStyle.paddingRight) || 0)
    : 0;
  const card = workspace.closest('.card');
  const cardStyle = card ? getComputedStyle(card) : null;
  const cardInsetX = cardStyle
    ? (parseFloat(cardStyle.paddingLeft) || 0) + (parseFloat(cardStyle.paddingRight) || 0)
    : 0;
  const shellStyle = getComputedStyle(els.plateStageShell);
  const shellInsetX = (parseFloat(shellStyle.paddingLeft) || 0) + (parseFloat(shellStyle.paddingRight) || 0);
  const shellInsetY = (parseFloat(shellStyle.paddingTop) || 0) + (parseFloat(shellStyle.paddingBottom) || 0);
  const viewportWidth = document.documentElement.clientWidth || window.innerWidth || minWidthPx;
  const maxContentWidth = viewportWidth - pageInsetX - cardInsetX;
  const width = Math.max(minWidthPx, maxContentWidth - sidePanelWidth - shellInsetX);
  const viewportHeight = window.innerHeight || minHeightPx;
  const stageTop = els.plateStage.getBoundingClientRect().top;
  const height = Math.max(minHeightPx, viewportHeight - stageTop - VIEWPORT_HEIGHT_RESERVE_PX - shellInsetY);

  return { width, height };
}


function getWellCenterXPx(plate, metrics, col) {
  return roundPx(metrics.gridOffsetXpx + col * metrics.pitchPx);
}

function getWellCenterYPx(plate, metrics, row) {
  return roundPx(metrics.gridOffsetYpx + row * metrics.pitchPx);
}

// ── Plate operations ─────────────────────────────────────────────────────────
function switchToPlate(plateId) {
  if (plateId === activePlateId) return;
  activePlateId = plateId;
  selectedWells.clear();
  selectionAnchor = null;
  renderPlateOptions();
  renderCornerToggles();
  renderAll();
  setStatus(`Editing ${AP().name}.`, 'info');
}

function addPlate() {
  const plate = makePlate(AP().plateType, nextPlateName());
  plates.push(plate);
  activePlateId = plate.id;
  selectedWells.clear();
  selectionAnchor = null;
  renderPlateOptions();
  renderCornerToggles();
  renderAll();
  setStatus(`Added ${plate.name}.`, 'success');
}

function removePlate(plateId) {
  if (plates.length <= 1) return;
  const plate = plates.find((p) => p.id === plateId);
  if (!plate) return;
  if (!confirm(`Remove ${plate.name} and its layout?`)) return;
  plates = plates.filter((p) => p.id !== plateId);
  if (activePlateId === plateId) activePlateId = plates[0].id;
  selectedWells.clear();
  selectionAnchor = null;
  renderPlateOptions();
  renderCornerToggles();
  renderAll();
  setStatus(`Removed ${plate.name}.`, 'info');
}

function renamePlate(plateId) {
  const plate = plates.find((p) => p.id === plateId);
  if (!plate) return;
  const name = (prompt('Plate name', plate.name) || '').trim();
  if (!name) return;
  plate.name = name;
  renderPlateTabs();
  renderPrintSummary();
}

// ── Field operations ─────────────────────────────────────────────────────────
function setActiveField(fieldId) {
  activeFieldId = fieldId;
  renderFields();
}

function addFieldFromInput() {
  const name = els.newFieldName.value.trim() || 'Field';
  const kind = els.newFieldKind.value === 'category' ? 'category' : 'text';
  const id = uid('f');
  const key = uniqueFieldKey(name);
  fields.push({ id, key, name, kind });
  if (kind === 'category') { categoriesByField[id] = []; activeCatByField[id] = null; }
  activeFieldId = id;
  els.newFieldName.value = '';
  renderFields();
  renderColorLabelDefaults();
  setStatus(`Added ${kind} field "${name}".`, 'success');
}

function deleteField(fieldId) {
  const field = getField(fieldId);
  if (!field) return;
  if (field.kind === 'category' && categoryFields().length === 1) return;
  fields = fields.filter((f) => f.id !== fieldId);
  delete categoriesByField[fieldId];
  delete activeCatByField[fieldId];
  plates.forEach((plate) => {
    Object.keys(plate.assignments).forEach((wellId) => {
      delete plate.assignments[wellId][fieldId];
      if (Object.keys(plate.assignments[wellId]).length === 0) delete plate.assignments[wellId];
    });
  });
  if (activeFieldId === fieldId) activeFieldId = fields[0].id;
  renderColorLabelDefaults();
  renderAll();
  setStatus(`Deleted field "${field.name}".`, 'info');
}

// Keep colorFieldId/labelFieldId pointing at valid fields after field changes.
function renderColorLabelDefaults() {
  if (!getField(colorFieldId) || getField(colorFieldId).kind !== 'category') {
    colorFieldId = (categoryFields()[0] || {}).id || colorFieldId;
  }
  if (!getField(labelFieldId)) labelFieldId = colorFieldId;
}

function setActiveCategory(fieldId, catId) {
  activeFieldId = fieldId;
  activeCatByField[fieldId] = catId;
  renderFields();
}

function nextCategoryColor(fieldId) {
  return GROUP_COLORS[cats(fieldId).length % GROUP_COLORS.length];
}

function addCategoryFromInput(fieldId) {
  const input = document.getElementById('new-cat-name');
  const name = (input ? input.value.trim() : '') || `Value ${cats(fieldId).length + 1}`;
  const cat = { id: uid('c'), name, color: nextCategoryColor(fieldId) };
  (categoriesByField[fieldId] = categoriesByField[fieldId] || []).push(cat);
  activeCatByField[fieldId] = cat.id;
  activeFieldId = fieldId;
  renderFields();
  renderLegend();
  renderPrintSummary();
  setStatus(`Added ${getField(fieldId).name} value "${name}".`, 'success');
}

function deleteCategory(fieldId, catId) {
  const cat = getCat(fieldId, catId);
  if (!cat) return;
  categoriesByField[fieldId] = cats(fieldId).filter((c) => c.id !== catId);
  plates.forEach((plate) => {
    Object.keys(plate.assignments).forEach((wellId) => {
      if (plate.assignments[wellId][fieldId] === catId) {
        delete plate.assignments[wellId][fieldId];
        if (Object.keys(plate.assignments[wellId]).length === 0) delete plate.assignments[wellId];
      }
    });
  });
  if (activeCatByField[fieldId] === catId) activeCatByField[fieldId] = (cats(fieldId)[0] || {}).id || null;
  renderAll();
  setStatus(`Deleted value "${cat.name}" and cleared its wells.`, 'info');
}

// ── Assign / clear / copy / paste (per-well field records) ───────────────────
function applyActiveFieldToSelection() {
  if (selectedWells.size === 0) { setStatus('Select wells first.', 'danger'); return; }
  const field = getField(activeFieldId);
  if (!field) return;
  let value;
  if (field.kind === 'category') {
    value = activeCatByField[field.id];
    if (!value) { setStatus(`Add a ${field.name} value first.`, 'danger'); return; }
  } else {
    const input = document.getElementById('text-value');
    value = input ? input.value.trim() : '';
    if (!value) { setStatus(`Enter a ${field.name} value.`, 'danger'); return; }
  }
  const ap = AP();
  selectedWells.forEach((wellId) => {
    const rec = ap.assignments[wellId] || (ap.assignments[wellId] = {});
    rec[field.id] = value;
  });
  renderPlate();
  renderLegend();
  renderSelectionState();
  renderPrintSummary();
  renderMaybeOverview();
  const shown = field.kind === 'category' ? (getCat(field.id, value)?.name || value) : value;
  setStatus(`Set ${field.name} = "${shown}" on ${selectedWells.size} wells.`, 'success');
}

function clearSelectedWells() {
  if (selectedWells.size === 0) return;
  const ap = AP();
  selectedWells.forEach((wellId) => { delete ap.assignments[wellId]; });
  renderPlate();
  renderLegend();
  renderSelectionState();
  renderPrintSummary();
  renderMaybeOverview();
  setStatus(`Cleared ${selectedWells.size} wells.`, 'info');
}

function copySelectedWells() {
  if (selectedWells.size === 0) {
    setStatus('Select wells before copying.', 'danger');
    return;
  }
  const ap = AP();
  const wells = sortedSelectedPositions();
  const minRow = Math.min(...wells.map((well) => well.row));
  const minCol = Math.min(...wells.map((well) => well.col));
  const cells = wells.map((well) => ({
    dr: well.row - minRow,
    dc: well.col - minCol,
    rec: { ...(ap.assignments[well.id] || {}) },
  }));
  clipboard = { cells };
  renderSelectionState();
  setStatus(`Copied ${clipboard.cells.length} wells.`, 'success');
}

function pasteClipboardAtSelection() {
  if (!clipboard) {
    setStatus('Copy wells before pasting.', 'danger');
    return;
  }
  const anchor = pasteAnchorPosition();
  if (!anchor) {
    setStatus('Select a destination well before pasting.', 'danger');
    return;
  }

  const ap = AP();
  const plate = PLATE_REFERENCE_MM[ap.plateType];
  const pasted = [];
  let skipped = 0;

  clipboard.cells.forEach((cell) => {
    const row = anchor.row + cell.dr;
    const col = anchor.col + cell.dc;
    if (row < 0 || col < 0 || row >= plate.rows || col >= plate.cols) {
      skipped += 1;
      return;
    }
    const wellId = getWellId(row, col);
    if (Object.keys(cell.rec).length) ap.assignments[wellId] = { ...cell.rec };
    else delete ap.assignments[wellId];
    pasted.push(wellId);
  });

  selectedWells = new Set(pasted);
  selectionAnchor = pasted[0] || selectionAnchor;
  renderPlate();
  renderLegend();
  renderSelectionState();
  renderPrintSummary();
  renderMaybeOverview();
  markPastedWells(pasted);

  const suffix = skipped > 0 ? ` ${skipped} out-of-bounds wells skipped.` : '';
  setStatus(`Pasted ${pasted.length} wells.${suffix}`, skipped > 0 ? 'warn' : 'success');
}

function markPastedWells(wellIds) {
  wellIds.forEach((wellId) => {
    const node = els.plateGrid.querySelector(`[data-well="${wellId}"]`);
    if (!node) return;
    node.classList.add('pasted');
    setTimeout(() => node.classList.remove('pasted'), 560);
  });
}

function pasteAnchorPosition() {
  const sorted = sortedWellIds(Array.from(selectedWells));
  const anchorWell = sorted[0] || selectionAnchor;
  return anchorWell ? wellPosition(anchorWell) : null;
}

// ── Read-only "view all" overview (SVG small multiples) ──────────────────────
function renderOverview() {
  els.overviewStage.innerHTML = '';
  plates.forEach((plate) => {
    const ref = PLATE_REFERENCE_MM[plate.plateType];
    const cell = document.createElement('div');
    cell.className = 'overview-cell';
    const title = document.createElement('div');
    title.className = 'overview-title';
    title.textContent = `${plate.name} · ${ref.label} · ${Object.keys(plate.assignments).length} labelled`;
    cell.appendChild(title);
    cell.insertAdjacentHTML('beforeend', buildPlateSvg(plate, ref, 360));
    els.overviewStage.appendChild(cell);
  });
}

function buildPlateSvg(plate, ref, targetWidthPx) {
  const pxPerMm = targetWidthPx / PLATE_UI_MM.outerWidth;
  const W = PLATE_UI_MM.outerWidth * pxPerMm;
  const H = PLATE_UI_MM.outerHeight * pxPerMm;
  const pitch = ref.pitchMm * pxPerMm;
  const wellD = ref.wellDiameterMm * pxPerMm;
  const r = wellD / 2;
  const offX = ref.a1ColOffsetMm * pxPerMm;
  const offY = ref.a1RowOffsetMm * pxPerMm;
  const cutSize = getPngPlateCutSize(W, H, pxPerMm);
  const pts = buildPlateFramePoints(W, H, cutSize, plate.cutCorners)
    .map(([x, y]) => `${roundPx(x)},${roundPx(y)}`).join(' ');
  const labelMode = getLabelMode(wellD);

  let cells = '';
  for (let row = 0; row < ref.rows; row++) {
    for (let col = 0; col < ref.cols; col++) {
      const wellId = getWellId(row, col);
      const color = colorForWell(plate, wellId);
      const cx = offX + col * pitch;
      const cy = offY + row * pitch;
      const fill = color || '#ffffff';
      const stroke = color ? 'rgba(0,0,0,0.28)' : '#d8d6d0';
      if (ref.shape === 'square') {
        cells += `<rect x="${roundPx(cx - r)}" y="${roundPx(cy - r)}" width="${roundPx(wellD)}" height="${roundPx(wellD)}" rx="${roundPx(wellD * 0.18)}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
      } else {
        cells += `<circle cx="${roundPx(cx)}" cy="${roundPx(cy)}" r="${roundPx(r)}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
      }
      const labelText = labelForWell(plate, wellId);
      if (labelText && labelMode !== 'color') {
        const txt = labelMode === 'compact' ? groupInitials(labelText) : labelText;
        const fs = clamp(wellD * (labelMode === 'compact' ? 0.4 : 0.26), 5, 13);
        cells += `<text x="${roundPx(cx)}" y="${roundPx(cy)}" font-size="${roundPx(fs)}" font-family="Arial, sans-serif" font-weight="700" fill="${contrastText(color || '#ffffff')}" text-anchor="middle" dominant-baseline="central">${labtoolsEscapeHtml(txt)}</text>`;
      }
    }
  }
  return `<svg width="${roundPx(W)}" height="${roundPx(H)}" viewBox="0 0 ${roundPx(W)} ${roundPx(H)}" xmlns="http://www.w3.org/2000/svg"><polygon points="${pts}" fill="#fffefb" stroke="#b9b5ac" stroke-width="1.5"/>${cells}</svg>`;
}

function exportPng() {
  const canvas = document.createElement('canvas');
  canvas.width = PNG_EXPORT.width;
  canvas.height = PNG_EXPORT.height;
  const ctx = canvas.getContext('2d');
  if (!ctx) {
    setStatus('PNG export is not available in this browser.', 'danger');
    return;
  }

  drawPngExport(ctx);

  const filename = plates.length > 1
    ? `microplate-layout-planner-${plates.length}-plates.png`
    : `microplate-layout-planner-${AP().plateType}-well.png`;
  canvas.toBlob((blob) => {
    if (!blob) {
      setStatus('Unable to generate PNG export.', 'danger');
      return;
    }
    if (typeof labtoolsDownloadBlob === 'function') {
      labtoolsDownloadBlob(filename, blob);
    } else {
      labtoolsDownloadBlob(filename, blob);
    }
    setStatus(`Exported ${filename}.`, 'success');
  }, 'image/png');
}

function drawPngExport(ctx) {
  const legendBounds = getPngLegendBounds();
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, PNG_EXPORT.width, PNG_EXPORT.height);

  const area = getPngPlateBounds();
  const n = plates.length;
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const cellGap = 24;
  const titleH = 30;
  const cellW = (area.width - cellGap * (cols - 1)) / cols;
  const cellH = (area.height - cellGap * (rows - 1)) / rows;

  plates.forEach((plate, i) => {
    const cx = area.x + (i % cols) * (cellW + cellGap);
    const cy = area.y + Math.floor(i / cols) * (cellH + cellGap);
    const ref = PLATE_REFERENCE_MM[plate.plateType];
    ctx.fillStyle = '#37352f';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '800 20px Arial, sans-serif';
    fillTextFit(ctx, `${plate.name} · ${ref.label}`, cx, cy + 20, cellW);
    const bounds = { x: cx, y: cy + titleH, width: cellW, height: cellH - titleH };
    const metrics = getPngPlateMetrics(ref, bounds);
    drawPngPlate(ctx, plate, ref, metrics, getPngLabelMode(ref));
  });

  const legendInfos = assignedCategoryInfo(colorFieldId, plates, 'compact');
  drawPngLegend(ctx, legendBounds, legendInfos, getField(colorFieldId));
  ctx.restore();
}

function getPngPlateBounds() {
  return {
    x: PNG_EXPORT.margin,
    y: PNG_EXPORT.margin,
    width: PNG_EXPORT.width - (PNG_EXPORT.margin * 2) - PNG_EXPORT.rightLegendWidth - PNG_EXPORT.gap,
    height: PNG_EXPORT.height - (PNG_EXPORT.margin * 2),
  };
}

function getPngLegendBounds() {
  return {
    x: PNG_EXPORT.width - PNG_EXPORT.margin - PNG_EXPORT.rightLegendWidth,
    y: PNG_EXPORT.margin,
    width: PNG_EXPORT.rightLegendWidth,
    height: PNG_EXPORT.height - (PNG_EXPORT.margin * 2),
  };
}

function getPngPlateMetrics(plate, bounds) {
  const pxPerMm = Math.min(bounds.width / PLATE_UI_MM.outerWidth, bounds.height / PLATE_UI_MM.outerHeight);
  const frameWidthPx = PLATE_UI_MM.outerWidth * pxPerMm;
  const frameHeightPx = PLATE_UI_MM.outerHeight * pxPerMm;
  const frameX = bounds.x + (bounds.width - frameWidthPx) / 2;
  const frameY = bounds.y + (bounds.height - frameHeightPx) / 2;
  const pitchPx = plate.pitchMm * pxPerMm;
  const wellDiameterPx = plate.wellDiameterMm * pxPerMm;
  const wellRadiusPx = wellDiameterPx / 2;
  const gridOffsetXpx = plate.a1ColOffsetMm * pxPerMm;
  const gridOffsetYpx = plate.a1RowOffsetMm * pxPerMm;
  const colLabelBandPx = Math.max(gridOffsetYpx - wellRadiusPx, PLATE_UI_MM.colLabelBandMm * pxPerMm);
  const rowLabelBandPx = Math.max(gridOffsetXpx - wellRadiusPx, PLATE_UI_MM.rowLabelBandMm * pxPerMm);

  return {
    x: frameX,
    y: frameY,
    frameWidthPx,
    frameHeightPx,
    pxPerMm,
    pitchPx,
    wellDiameterPx,
    gridOffsetXpx,
    gridOffsetYpx,
    colLabelCenterYpx: Math.max(8, colLabelBandPx / 2),
    rowLabelCenterXpx: Math.max(8, rowLabelBandPx / 2),
    axisLabelFontPx: clamp(pxPerMm * 2.1, 12, 22),
    wellIdFontPx: clamp(wellDiameterPx * 0.18, 10, 24),
    wellLabelFontPx: clamp(wellDiameterPx * 0.11, 9, 18),
    wellInitialsFontPx: clamp(wellDiameterPx * 0.2, 10, 22),
  };
}

function getPngLabelMode(plate) {
  return getLabelMode(plate.wellDiameterMm * PLATE_SCALE_LIMITS.max);
}

function drawPngPlate(ctx, plateObj, ref, metrics, labelMode) {
  const cutSize = getPngPlateCutSize(metrics.frameWidthPx, metrics.frameHeightPx, metrics.pxPerMm);
  const points = buildPlateFramePoints(metrics.frameWidthPx, metrics.frameHeightPx, cutSize, plateObj.cutCorners);

  ctx.save();
  ctx.translate(metrics.x, metrics.y);
  drawPngPolygon(ctx, points, '#fffefb', '#b9b5ac', 3);

  ctx.fillStyle = '#6b665d';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${metrics.axisLabelFontPx}px Arial, sans-serif`;

  for (let col = 0; col < ref.cols; col++) {
    ctx.fillText(String(col + 1), getPngWellCenterX(metrics, col), metrics.colLabelCenterYpx);
  }

  for (let row = 0; row < ref.rows; row++) {
    ctx.fillText(rowLabel(row), metrics.rowLabelCenterXpx, getPngWellCenterY(metrics, row));
    for (let col = 0; col < ref.cols; col++) {
      drawPngWell(ctx, plateObj, ref, metrics, row, col, labelMode);
    }
  }

  ctx.restore();
}

function drawPngWell(ctx, plateObj, ref, metrics, row, col, labelMode) {
  const wellId = getWellId(row, col);
  const color = colorForWell(plateObj, wellId);
  const labelText = labelForWell(plateObj, wellId);
  const x = getPngWellCenterX(metrics, col);
  const y = getPngWellCenterY(metrics, row);
  const size = metrics.wellDiameterPx;
  const radius = size / 2;

  ctx.save();
  ctx.fillStyle = color || '#ffffff';
  ctx.strokeStyle = color ? 'rgba(0, 0, 0, 0.28)' : '#d8d6d0';
  ctx.lineWidth = Math.max(1.5, size * 0.035);

  if (ref.shape === 'square') {
    drawRoundRectPath(ctx, x - radius, y - radius, size, size, size * 0.18);
  } else {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.stroke();

  if (labelText && labelMode === 'rich') {
    ctx.fillStyle = contrastText(color || '#ffffff');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `800 ${metrics.wellIdFontPx}px Arial, sans-serif`;
    ctx.fillText(wellId, x, y - metrics.wellIdFontPx * 0.42);
    ctx.font = `700 ${metrics.wellLabelFontPx}px Arial, sans-serif`;
    fillTextFit(ctx, labelText, x, y + metrics.wellLabelFontPx * 0.82, size * 0.82);
  } else if (labelText && labelMode === 'compact') {
    ctx.fillStyle = contrastText(color || '#ffffff');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `800 ${metrics.wellInitialsFontPx}px Arial, sans-serif`;
    ctx.fillText(groupInitials(labelText), x, y);
  }

  ctx.restore();
}

function drawPngLegend(ctx, bounds, groupsForLegend, field) {
  ctx.save();
  ctx.fillStyle = '#37352f';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '800 24px Arial, sans-serif';
  const legendTitle = `${field ? field.name : 'Group'} Legend`;
  ctx.fillText(legendTitle, bounds.x, bounds.y + 28);

  if (groupsForLegend.length === 0) {
    ctx.fillStyle = '#78746c';
    ctx.font = '600 20px Arial, sans-serif';
    ctx.fillText('No assigned values', bounds.x, bounds.y + 64);
    ctx.restore();
    return;
  }

  const rowHeight = 38;
  const startY = bounds.y + 66;

  groupsForLegend.forEach((group, index) => {
    const x = bounds.x;
    const y = startY + index * rowHeight;
    const maxNameWidth = bounds.width - 118;

    ctx.fillStyle = group.color;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x + 11, y - 7, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    let textX = x + 28;
    if (group.abbreviationUsed) {
      ctx.fillStyle = '#37352f';
      ctx.font = '800 17px Arial, sans-serif';
      ctx.fillText(`${group.abbreviation} =`, textX, y);
      textX += ctx.measureText(`${group.abbreviation} =`).width + 7;
    }

    ctx.fillStyle = '#37352f';
    ctx.font = '700 18px Arial, sans-serif';
    fillTextFit(ctx, group.name, textX, y, Math.max(70, maxNameWidth - (textX - x - 28)));
    ctx.fillStyle = '#78746c';
    ctx.font = '600 16px Arial, sans-serif';
    ctx.fillText(`(${group.count})`, x + columnWidth - 68, y);
  });

  ctx.restore();
}

function getPngPlateCutSize(width, height, pxPerMm) {
  const requested = PLATE_UI_MM.cornerCutMm * pxPerMm;
  const safeMax = Math.max(18, Math.min((width / 2) - 8, (height / 2) - 8));
  return Math.round(Math.min(requested, safeMax));
}

function getPngWellCenterX(metrics, col) {
  return roundPx(metrics.gridOffsetXpx + col * metrics.pitchPx);
}

function getPngWellCenterY(metrics, row) {
  return roundPx(metrics.gridOffsetYpx + row * metrics.pitchPx);
}

function drawPngPolygon(ctx, points, fill, stroke, lineWidth) {
  ctx.beginPath();
  points.forEach(([x, y], index) => {
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = lineWidth;
  ctx.stroke();
}

function drawRoundRectPath(ctx, x, y, width, height, radius) {
  const safeRadius = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + safeRadius, y);
  ctx.lineTo(x + width - safeRadius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
  ctx.lineTo(x + width, y + height - safeRadius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
  ctx.lineTo(x + safeRadius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
  ctx.lineTo(x, y + safeRadius);
  ctx.quadraticCurveTo(x, y, x + safeRadius, y);
  ctx.closePath();
}

function fillTextFit(ctx, text, x, y, maxWidth) {
  const value = String(text || '');
  if (ctx.measureText(value).width <= maxWidth) {
    ctx.fillText(value, x, y);
    return;
  }

  let clipped = value;
  while (clipped.length > 1 && ctx.measureText(`${clipped}...`).width > maxWidth) {
    clipped = clipped.slice(0, -1);
  }
  ctx.fillText(`${clipped}...`, x, y);
}

// CSV schema. Structural columns (plate_type, plate, row, column, well) frame the file;
// each field contributes one data column named by its `key`, and every category field
// adds a `<key>_color` column so the palette round-trips. The lowercase `well`, `group`,
// `sample`, `gene` headers are the interop contract with the qPCR Analysis tool.
const CSV_STRUCTURAL = ['plate_type', 'plate', 'row', 'column', 'well'];

function sanitizeFieldKey(name) {
  return String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'field';
}

function uniqueFieldKey(name) {
  // Reserved suffixes carry palette / derived metadata in the CSV — a field key ending in
  // one would be swallowed by the import heuristic, so nudge it (e.g. cell_color -> cell_color_f).
  let base = sanitizeFieldKey(name);
  if (base.endsWith('_color') || base.endsWith('_abbreviation')) base += '_f';
  const taken = new Set(fields.map((f) => f.key).concat(CSV_STRUCTURAL));
  if (!taken.has(base)) return base;
  let n = 2;
  while (taken.has(`${base}_${n}`)) n += 1;
  return `${base}_${n}`;
}

function prettyFieldName(key) {
  const known = { group: 'Group', sample: 'Sample ID', gene: 'Gene' };
  if (known[key]) return known[key];
  return key.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
}

function exportCsv() {
  const multi = plates.length > 1;
  const catFields = categoryFields();
  const header = ['plate_type', ...(multi ? ['plate'] : []), 'row', 'column', 'well',
    ...fields.map((f) => f.key), ...catFields.map((f) => `${f.key}_color`)];
  const rows = [header];

  plates.forEach((plate) => {
    const ref = PLATE_REFERENCE_MM[plate.plateType];
    for (let row = 0; row < ref.rows; row++) {
      for (let col = 0; col < ref.cols; col++) {
        const wellId = getWellId(row, col);
        const rec = plate.assignments[wellId] || {};
        const fieldVals = fields.map((f) => {
          const v = rec[f.id];
          if (v === undefined || v === '') return '';
          return f.kind === 'category' ? (getCat(f.id, v)?.name || '') : String(v);
        });
        const colorVals = catFields.map((f) => {
          const cat = getCat(f.id, rec[f.id]);
          return cat ? cat.color : '';
        });
        rows.push([plate.plateType, ...(multi ? [plate.name] : []), rowLabel(row), String(col + 1), wellId, ...fieldVals, ...colorVals]);
      }
    }
  });

  const csv = labtoolsRowsToCsv(rows);
  const filename = multi
    ? `microplate-layout-planner-${plates.length}-plates.csv`
    : `microplate-layout-planner-${AP().plateType}-well.csv`;
  labtoolsDownloadText(filename, csv, 'text/csv;charset=utf-8');
  setStatus(`Exported ${filename}.`, 'success');
}

function onImportCsvFile(event) {
  const input = event.target;
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      importCsv(String(reader.result || ''));
    } catch (err) {
      setStatus('Could not read that CSV — is it a plate layout export?', 'danger');
    }
    input.value = '';
  };
  reader.onerror = () => {
    setStatus('Could not read the file.', 'danger');
    input.value = '';
  };
  reader.readAsText(file);
}

// Rebuild plates + fields from a CSV in this tool's export format. Columns are matched by
// header name (order-tolerant). Structural columns (plate_type/plate/row/column/well) and
// derived columns (*_color, *_abbreviation) frame the data; every other column becomes a
// field — category when a matching `<key>_color` column exists (or the legacy `group`),
// else text. Rows are grouped into plates by the optional `plate` column.
function importCsv(text) {
  const rows = labtoolsCsvToRows(text).filter((row) => row.length && row.some((cell) => cell.trim().length));
  if (rows.length < 2) {
    setStatus('CSV has no data rows.', 'danger');
    return;
  }
  const header = rows[0].map((cell) => cell.trim().toLowerCase());
  const idx = {};
  header.forEach((h, i) => { if (!(h in idx)) idx[h] = i; });
  const iWell = idx.well;
  if (iWell === undefined) {
    setStatus('CSV needs a "well" column.', 'danger');
    return;
  }

  const structural = new Set(CSV_STRUCTURAL);
  const colorCols = new Set(header.filter((h) => h.endsWith('_color')));
  const fieldKeys = header.filter((h) => h && !structural.has(h) && !h.endsWith('_color') && !h.endsWith('_abbreviation'));
  if (fieldKeys.length === 0) {
    setStatus('CSV has no field columns (e.g. group, sample, gene).', 'danger');
    return;
  }

  const newFields = fieldKeys.map((key) => ({
    id: key,
    key,
    name: prettyFieldName(key),
    kind: (colorCols.has(`${key}_color`) || key === 'group') ? 'category' : 'text',
  }));
  if (!newFields.some((f) => f.kind === 'category')) newFields[0].kind = 'category';

  const newCats = {};
  const catLookup = {};
  newFields.filter((f) => f.kind === 'category').forEach((f) => { newCats[f.id] = []; catLookup[f.id] = new Map(); });

  const plateMap = new Map();
  const getPlate = (name, ptype) => {
    const keyName = name || 'Plate 1';
    let p = plateMap.get(keyName);
    if (!p) {
      p = { id: uid('p'), name: keyName, plateType: PLATE_REFERENCE_MM[ptype] ? ptype : '96', cutCorners: new Set(['top-left']), assignments: {} };
      plateMap.set(keyName, p);
    } else if (PLATE_REFERENCE_MM[ptype]) {
      p.plateType = ptype;
    }
    return p;
  };

  for (let i = 1; i < rows.length; i++) {
    const cells = rows[i];
    const well = (cells[iWell] || '').trim().toUpperCase();
    if (!/^[A-Z]+\d+$/.test(well)) continue;
    const ptype = idx.plate_type !== undefined ? (cells[idx.plate_type] || '').trim() : '';
    const pname = idx.plate !== undefined ? (cells[idx.plate] || '').trim() : '';
    const plate = getPlate(pname, ptype);

    newFields.forEach((field) => {
      const raw = (cells[idx[field.key]] || '').trim();
      if (!raw) return;
      let value = raw;
      if (field.kind === 'category') {
        const map = catLookup[field.id];
        value = map.get(raw);
        if (!value) {
          const color = colorCols.has(`${field.key}_color`) ? (cells[idx[`${field.key}_color`]] || '').trim() : '';
          value = uid('c');
          newCats[field.id].push({ id: value, name: raw, color: isValidHexColor(color) ? color : GROUP_COLORS[newCats[field.id].length % GROUP_COLORS.length] });
          map.set(raw, value);
        }
      }
      (plate.assignments[well] = plate.assignments[well] || {})[field.id] = value;
    });
  }

  const builtPlates = Array.from(plateMap.values());
  if (!builtPlates.length) {
    setStatus('No wells found in CSV.', 'danger');
    return;
  }
  builtPlates.forEach(trimPlate);

  fields = newFields;
  categoriesByField = newCats;
  plates = builtPlates;
  activePlateId = plates[0].id;
  colorFieldId = newFields.find((f) => f.kind === 'category').id;
  labelFieldId = colorFieldId;
  activeFieldId = colorFieldId;
  activeCatByField = {};
  newFields.filter((f) => f.kind === 'category').forEach((f) => { activeCatByField[f.id] = (newCats[f.id][0] || {}).id || null; });
  selectedWells.clear();
  selectionAnchor = null;
  clipboard = null;
  if (overviewMode) toggleOverview();

  renderPlateOptions();
  renderCornerToggles();
  renderAll();

  const labelled = builtPlates.reduce((n, p) => n + Object.keys(p.assignments).length, 0);
  setStatus(`Imported ${builtPlates.length} plate(s), ${labelled} labelled wells across ${newFields.length} fields.`, 'success');
}

function isValidHexColor(value) {
  return /^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(String(value).trim());
}

function resetPlate() {
  if (!confirm(`Reset the layout on ${AP().name}?`)) return;
  AP().assignments = {};
  selectedWells.clear();
  selectionAnchor = null;
  clipboard = null;
  renderAll();
  setStatus(`${AP().name} reset.`, 'info');
}

// Drop out-of-range assignments/selection from a single plate after a size change.
function trimPlate(plate) {
  const ref = PLATE_REFERENCE_MM[plate.plateType];
  Object.keys(plate.assignments).forEach((wellId) => {
    const pos = wellPosition(wellId);
    if (pos.row >= ref.rows || pos.col >= ref.cols) delete plate.assignments[wellId];
  });
}

function trimAssignmentsAndSelectionToPlate() {
  const plate = AP();
  const ref = PLATE_REFERENCE_MM[plate.plateType];
  trimPlate(plate);
  selectedWells = new Set(Array.from(selectedWells).filter((wellId) => {
    const pos = wellPosition(wellId);
    return pos.row < ref.rows && pos.col < ref.cols;
  }));
  if (selectionAnchor) {
    const pos = wellPosition(selectionAnchor);
    if (pos.row >= ref.rows || pos.col >= ref.cols) selectionAnchor = null;
  }
}

function sortedSelectedPositions() {
  return sortedWellIds(Array.from(selectedWells)).map((wellId) => ({
    id: wellId,
    ...wellPosition(wellId),
  }));
}

function sortedWellIds(wellIds) {
  return wellIds.slice().sort((a, b) => {
    const pa = wellPosition(a);
    const pb = wellPosition(b);
    if (pa.row !== pb.row) return pa.row - pb.row;
    return pa.col - pb.col;
  });
}

function getLabelMode(wellDiameterPx) {
  if (wellDiameterPx >= 40) return 'rich';
  if (wellDiameterPx >= 26) return 'compact';
  return 'color';
}

function getWellId(row, col) {
  return `${rowLabel(row)}${col + 1}`;
}

function rowLabel(row) {
  let label = '';
  let index = row;
  do {
    label = String.fromCharCode(65 + (index % 26)) + label;
    index = Math.floor(index / 26) - 1;
  } while (index >= 0);
  return label;
}

function wellPosition(wellId) {
  const match = /^([A-Z]+)(\d+)$/.exec(wellId);
  if (!match) return { row: 0, col: 0 };
  const row = match[1].split('').reduce((value, char) => {
    return value * 26 + char.charCodeAt(0) - 64;
  }, 0) - 1;
  return {
    row,
    col: parseInt(match[2], 10) - 1,
  };
}

function getCurrentLabelMode() {
  return els.plateGrid ? els.plateGrid.dataset.labelMode || '' : '';
}

function groupInitials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return `${parts[0][0]}${parts[1][0]}`.toUpperCase();
}

function cornerLabel(cornerId) {
  return cornerId.split('-').map((part) => part[0].toUpperCase() + part.slice(1)).join(' ');
}

function setStatus(message, type) {
  els.statusLine.textContent = message;
  els.statusLine.className = `lt-alert status-line lt-alert-${type || 'info'}`;
}

function contrastText(hex) {
  const rgb = hex.replace('#', '');
  const r = parseInt(rgb.slice(0, 2), 16);
  const g = parseInt(rgb.slice(2, 4), 16);
  const b = parseInt(rgb.slice(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.58 ? '#37352f' : '#ffffff';
}

function mmToPx(mm, scale) {
  return roundPx(mm * scale);
}

function roundPx(value) {
  return Math.round(value * 100) / 100;
}

function px(value) {
  return `${roundPx(value)}px`;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

// ─── Workbench integration ──────────────────────────────────────────────────
const TOOL_NAME = 'microplate-layout-planner';
const WbTypes = { produces: 'plate-layout', consumes: ['plate-layout'] };

function serializeForWorkbench() {
  return {
    plates: plates.map(function (p) {
      return {
        name: p.name,
        plateType: p.plateType,
        cutCorners: Array.from(p.cutCorners),
        assignments: p.assignments,
      };
    }),
    fields: fields.map(function (f) {
      return { id: f.id, key: f.key, name: f.name, kind: f.kind };
    }),
    categoriesByField: categoriesByField,
  };
}

function applyFromWorkbench(data, type) {
  // Rebuild plates
  plates = (data.plates || []).map(function (p) {
    return {
      id: uid('p'),
      name: p.name,
      plateType: p.plateType,
      cutCorners: new Set(p.cutCorners || []),
      assignments: p.assignments || {},
    };
  });
  if (plates.length === 0) plates = [makePlate('96', 'Plate 1')];
  activePlateId = plates[0].id;
  // Rebuild fields
  fields = (data.fields || []).map(function (f) {
    return { id: f.id, key: f.key, name: f.name, kind: f.kind };
  });
  if (fields.length === 0) seedDefaults();

  // Rebuild categories
  categoriesByField = data.categoriesByField || {};
  activeCatByField = {};
  Object.keys(categoriesByField).forEach(function (fid) {
    var cats = categoriesByField[fid];
    if (cats && cats.length) activeCatByField[fid] = cats[0].id;
  });

  // Reset color/label field pointers
  var catFields = categoryFields();
  colorFieldId = (catFields[0] || {}).id || 'group';
  labelFieldId = colorFieldId;
  activeFieldId = colorFieldId;

  // Reset selection
  selectedWells = new Set();
  selectionAnchor = null;
  clipboard = null;

  // Auto-set plate-type dropdowns and re-render
  renderAll();
}

/**
 * Artifact-handoff consumer: the wired `plate-layout` field rides the same
 * shape applyFromWorkbench understands.
 */
function applyInputs(resolved) {
  if (!resolved) return;
  if (resolved['plate-layout'] != null) {
    applyFromWorkbench(resolved['plate-layout'], 'plate-layout');
  }
}

function suggestLabel() {
  var plateNames = plates.map(function (p) { return p.name; }).filter(Boolean);
  var prefix = plateNames.length ? plateNames.join(', ') : 'Plate Layout';
  var date = new Date().toISOString().slice(0, 10);
  return prefix + ' ' + date;
}

document.addEventListener('DOMContentLoaded', function () {
  var saveBtn = document.getElementById('wb-save-btn');
  var loadBtn = document.getElementById('wb-load-btn');

  if (saveBtn) saveBtn.addEventListener('click', function () {
    var label = prompt('Name this item:', suggestLabel());
    if (!label || !label.trim()) return;
    label = label.trim();

    workbench.findByName(label).then(function (existing) {
      if (existing) {
        if (!confirm('"' + label + '" already exists. Overwrite?')) return;
        return workbench.remove(existing.id);
      }
    }).then(function () {
      var meta = {
        wellCount: plates.reduce(function (sum, p) { return sum + Object.keys(p.assignments).length; }, 0),
        plateCount: plates.length,
        plateFormat: plates.map(function (p) { return p.plateType; }).join(','),
      };
      return workbench.put(WbTypes.produces, label, serializeForWorkbench(), meta, TOOL_NAME);
    }).then(function () {
      showToast('✓ Saved "' + label + '"');
    }).catch(function (e) {
      showToast('✗ ' + e.message);
      console.error('Workbench save error:', e);
    });
  });

  if (loadBtn) loadBtn.addEventListener('click', function () {
    workbench.getByType('plate-layout').then(function (items) {
      if (items.length === 0) {
        showToast('No plate layouts in Workbench');
        return;
      }
      showPicker(items, function (item) {
        applyFromWorkbench(item.data, item.type);
        showToast('✓ Applied "' + item.label + '"');
      });
    }).catch(function (e) {
      console.error('Workbench load error:', e);
    });
  });

  // Workflow handoff: save this layout and open the qPCR Analyzer with it loaded.
  // Artifact envelope handoff — qpcr-analysis wires the plate-layout field via
  // its input ports (labtoolsConsumeArtifactHandoff).
  var toQpcrBtn = document.getElementById('wb-to-qpcr-btn');
  if (toQpcrBtn) toQpcrBtn.addEventListener('click', function () {
    labtoolsHandoffArtifact(mplTool, '../qpcr-analysis/index.html', suggestLabel())
      .catch(function (e) { showToast('✗ ' + e.message); console.error('Handoff:', e); });
  });

  // Workflow handoff: auto-apply a layout passed from qpcr-plate-planner (?wbLoad).
  // Workflow handoff: auto-apply an incoming plate-layout (?wbLoad). Dual
  // channel: artifact envelopes wire through applyInputs (field ports) and
  // strip the param; legacy typed payloads keep the applyFromWorkbench path.
  if (typeof labtoolsConsumeArtifactHandoff === 'function') {
    labtoolsConsumeArtifactHandoff(mplTool, applyInputs);
  }
  if (typeof labtoolsConsumeHandoff === 'function') {
    labtoolsConsumeHandoff(applyFromWorkbench);
  }
});

// ─── Artifact model (full-state recovery + wireable outputs) ────────────────
// Pure-function view: the plates (geometry + assignments), field definitions,
// categories, AND the UI selectors (color/label/active field, active plate,
// overview) are all `params`. Transient selection/clipboard resets. This extends
// the plate-layout serialize with the view state so restore reproduces the tool
// exactly (not just the data). cutCorners Set ↔ array for JSON/CSV.

/** Capture ALL control state (plates + fields + categories + view selectors). */
function readParams() {
  return {
    plates: plates.map(function (p) {
      return {
        id: p.id, name: p.name, plateType: p.plateType,
        cutCorners: Array.from(p.cutCorners), assignments: p.assignments,
      };
    }),
    fields: fields.map(function (f) { return { id: f.id, key: f.key, name: f.name, kind: f.kind }; }),
    categoriesByField: categoriesByField,
    activeCatByField: activeCatByField,
    colorFieldId: colorFieldId,
    labelFieldId: labelFieldId,
    activeFieldId: activeFieldId,
    activePlateId: activePlateId,
    overviewMode: overviewMode,
  };
}

/** Restore control state (preserving plate ids + view selectors), then re-render. */
function applyParams(p) {
  p = p || {};
  plates = (p.plates || []).map(function (pl) {
    return {
      id: pl.id || uid('p'), name: pl.name, plateType: pl.plateType,
      cutCorners: new Set(pl.cutCorners || []), assignments: pl.assignments || {},
    };
  });
  if (plates.length === 0) plates = [makePlate('96', 'Plate 1')];

  fields = (p.fields || []).map(function (f) { return { id: f.id, key: f.key, name: f.name, kind: f.kind }; });
  if (fields.length === 0) seedDefaults();

  categoriesByField = p.categoriesByField || {};
  activeCatByField = p.activeCatByField || {};
  Object.keys(categoriesByField).forEach(function (fid) {
    if (activeCatByField[fid] == null) {
      var cats = categoriesByField[fid];
      if (cats && cats.length) activeCatByField[fid] = cats[0].id;
    }
  });

  var catFields = categoryFields();
  var firstCat = (catFields[0] || {}).id || 'group';
  colorFieldId = p.colorFieldId || firstCat;
  labelFieldId = p.labelFieldId || colorFieldId;
  activeFieldId = p.activeFieldId || colorFieldId;
  activePlateId = (p.activePlateId && plates.some(function (pl) { return pl.id === p.activePlateId; }))
    ? p.activePlateId : plates[0].id;
  overviewMode = !!p.overviewMode;

  selectedWells = new Set(); selectionAnchor = null; clipboard = null;
  renderAll();
}

/** Declared final output: the microplate layout. */
function readOutputs() {
  return { 'plate-layout': serializeForWorkbench() };
}

// Bridge: registers workbench types and provides artifact build/save/restore/CSV.
const mplTool = labtoolsDefineTool({
  id: 'microplate-layout-planner',
  produces: ['plate-layout'],
  consumes: ['plate-layout'],
  readParams: readParams,
  applyParams: applyParams,
  readOutputs: readOutputs,
  outputFields: [{ id: 'plate-layout', label: 'Microplate layout' }],
  inputPorts: [{ field: 'plate-layout' }],
});

// Explicit legacy declaration (kept for the static registry test; the bridge
// above registers the same types at runtime — idempotent).
labtoolsRegisterToolTypes('microplate-layout-planner', ['plate-layout'], ['plate-layout']);

if (typeof labtoolsMountArtifactControls === 'function') {
  labtoolsMountArtifactControls(mplTool, { container: '#lt-artifact-controls', fileBase: 'microplate-layout-planner' });
}

labtoolsRegisterTestHooks('microplate-layout-planner', {
  serialize: serializeForWorkbench,
  apply: applyFromWorkbench,
  readParams: readParams,
  applyParams: applyParams,
  readOutputs: readOutputs,
  buildArtifact: function () { return mplTool.build(); },
  toCsv: function () { return mplTool.toCsv(); },
  fromCsv: function (text) { return mplTool.fromCsv(text); },
  state: function () {
    return {
      plates: plates.map(function (p) {
        return { name: p.name, plateType: p.plateType, wells: Object.keys(p.assignments || {}).length };
      }),
      fields: fields.map(function (f) { return f.name; }),
    };
  },
});

// ─── Shared-layer runtime boot (manifest + load self-check; idempotent) ──────
if (typeof labtools !== 'undefined' && labtools.runtime && labtools.runtime.boot) {
  labtools.runtime.boot({ manifest: Object.assign({}, window.labtoolsToolManifest, {
    readParams: readParams, applyParams: applyParams, readOutputs: readOutputs,
  })});
}
</script>
