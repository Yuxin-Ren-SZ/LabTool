<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Microplate Layout Planner - LabTools</title>
  <link rel="stylesheet" href="../../assets/css/labtools.css"/>
  <script src="../../assets/js/labtools-types.js"></script>
  <script src="../../assets/js/labtools-workbench.js"></script>
  <script src="../../assets/js/labtools-common.js"></script>
  <script src="../../assets/js/labtools-artifact.js"></script>
  <script src="../../assets/js/labtools-artifact-ui.js"></script>
  <script src="../../assets/js/labtools-workflow.js"></script>
  <script src="../../assets/js/labtools-runtime.js"></script>
  <script src="manifest.js"></script>
  <style>
    .card {
      width: fit-content;
      max-width: calc(100vw - 32px);
      padding: 24px;
    }

    .layout-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .layout-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .control-strip {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(220px, max-content) auto;
      gap: 14px;
      align-items: end;
      justify-content: start;
      margin-bottom: 16px;
    }

    .field-block {
      min-width: 0;
    }

    .field-block .lt-label {
      margin-bottom: 6px;
    }

    .corner-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .corner-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-muted);
      font-size: var(--fs-xs);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.14s, background 0.14s, color 0.14s;
    }

    .corner-toggle:hover {
      border-color: var(--blue);
      background: var(--blue-bg);
      color: var(--blue-dark);
    }

    .corner-toggle input {
      width: 14px;
      height: 14px;
      accent-color: var(--blue-dark);
      margin: 0;
    }

    .workspace {
      display: flex;
      flex-wrap: nowrap;
      gap: 18px;
      align-items: start;
      justify-content: center;
    }

    .plate-stage {
      flex: 0 1 auto;
      min-width: 0;
      width: fit-content;
      max-width: calc(100% - 336px);
      overflow: auto;
    }

    .plate-stage-shell {
      display: inline-flex;
      align-items: flex-start;
      justify-content: flex-start;
      justify-self: start;
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
      width: max-content;
      max-width: none;
    }

    .plate-frame {
      --plate-frame-border: #d3d0c9;
      display: inline-block;
      flex: none;
      position: relative;
      width: 524px;
      height: 351px;
      padding: 0;
      background: transparent;
      isolation: isolate;
    }

    .plate-shell {
      position: absolute;
      inset: 0;
      background: #fffefb;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), inset 0 -12px 28px rgba(55, 53, 47, 0.035);
      pointer-events: none;
      z-index: 0;
    }

    .plate-outline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .plate-outline path {
      fill: none;
      stroke: var(--plate-frame-border);
      stroke-width: 2;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }

    .plate-grid {
      width: 100%;
      height: 100%;
      user-select: none;
      position: relative;
      z-index: 2;
    }

    .axis-cell {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 18px;
      min-height: 18px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: var(--axis-label-font, var(--fs-2xs));
      font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background 0.12s, color 0.12s;
      z-index: 3;
    }

    .axis-cell:hover {
      background: var(--blue-bg);
      color: var(--blue-dark);
    }

    .well {
      --well-color: var(--surface);
      --well-text: var(--text);
      width: var(--well-size, 30px);
      height: var(--well-size, 30px);
      border: 1.5px solid #d8d6d0;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 0;
      line-height: 1.05;
      position: absolute;
      left: var(--well-x, 0px);
      top: var(--well-y, 0px);
      transform: translate(-50%, -50%);
      transition: transform 0.1s, border-color 0.12s, box-shadow 0.12s, background 0.12s;
    }

    .well[data-shape="round"] {
      border-radius: 50%;
    }

    .well[data-shape="square"] {
      border-radius: calc(var(--well-size, 30px) * 0.18);
    }

    .well:hover {
      border-color: var(--blue);
      transform: translate(-50%, -50%) scale(1.03);
    }

    .well.assigned {
      background: var(--well-color);
      border-color: rgba(0, 0, 0, 0.22);
      color: var(--well-text);
    }

    .well.selected {
      border-color: var(--blue-dark);
      box-shadow: 0 0 0 3px rgba(51, 102, 204, 0.18);
      z-index: 2;
    }

    .well.pasted {
      animation: pastePulse 0.52s ease-out;
    }

    @keyframes pastePulse {
      0% { transform: translate(-50%, -50%) scale(0.88); }
      60% { transform: translate(-50%, -50%) scale(1.08); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .well-id {
      display: none;
      font-family: var(--font-mono);
      font-size: var(--well-id-size, 0.62rem);
      font-weight: 800;
      letter-spacing: 0;
    }

    .well-label {
      display: none;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--well-label-size, 0.58rem);
      font-weight: 700;
    }

    .well-initials {
      display: none;
      font-size: var(--well-initials-size, 0.62rem);
      font-weight: 800;
      letter-spacing: 0;
    }

    .plate-grid[data-label-mode="rich"] .well-id {
      display: block;
    }

    .plate-grid[data-label-mode="rich"] .well.has-label .well-label {
      display: block;
    }

    .plate-grid[data-label-mode="compact"] .well.has-label .well-initials {
      display: block;
    }

    .side-panel {
      flex: 0 0 318px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      background: var(--surface-subtle);
      padding: 14px;
    }

    .side-section + .side-section {
      border-top: 1px solid var(--border-subtle);
      margin-top: 14px;
      padding-top: 14px;
    }

    .selection-meter {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .meter-box {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 10px 11px;
    }

    .meter-label {
      color: var(--text-muted);
      font-size: var(--fs-2xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .meter-value {
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .button-grid .lt-btn,
    .button-grid .btn-reset {
      width: 100%;
      padding-left: 10px;
      padding-right: 10px;
    }

    .side-panel button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .group-create {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .group-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .group-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 7px;
      transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
    }

    .group-row.active {
      border-color: var(--blue-dark);
      box-shadow: 0 0 0 2px var(--blue-border);
      background: var(--blue-bg);
    }

    .group-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.16);
      padding: 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .group-name {
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      outline: none;
    }

    .group-delete {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-dim);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }

    .group-delete:hover {
      background: var(--red-bg);
      color: var(--red);
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .legend-count {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .legend-abbrev {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      margin-left: 6px;
      padding: 2px 5px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-2xs);
      font-weight: 800;
      line-height: 1;
    }

    .status-line {
      margin-top: 14px;
      min-height: 40px;
    }

    .print-summary {
      display: none;
      margin-bottom: 14px;
    }

    .print-legend {
      display: none;
      margin-bottom: 14px;
      break-inside: avoid;
    }

    .print-legend-title {
      margin-bottom: 6px;
      color: #333;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .print-legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 6px 12px;
    }

    .print-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: #333;
      font-size: 0.76rem;
    }

    .print-legend-swatch {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(0, 0, 0, 0.28);
      border-radius: 50%;
      flex: 0 0 auto;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    .print-legend-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .print-legend-abbrev {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .print-legend-count {
      flex: 0 0 auto;
      color: #666;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 980px) {
      .layout-top {
        flex-direction: column;
      }

      .layout-actions {
        justify-content: flex-start;
      }

      .control-strip {
        grid-template-columns: 1fr;
      }

      .workspace {
        flex-direction: column;
      }

      .plate-stage {
        width: 100%;
        max-width: 100%;
      }

      .side-panel {
        flex: none;
        width: 100%;
        order: -1;
      }
    }

    @media (max-width: 560px) {
      .card {
        padding: 18px 14px;
      }

      .plate-stage-shell {
        padding: 12px;
      }

      .control-strip {
        gap: 10px;
      }

      .button-grid {
        grid-template-columns: 1fr;
      }
    }

    .plate-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 14px;
    }

    .plate-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }

    .plate-tab.active {
      border-color: var(--blue-dark);
      background: var(--blue-bg);
      color: var(--blue-dark);
    }

    .plate-tab .plate-tab-size {
      color: var(--text-muted);
      font-size: var(--fs-2xs);
      font-weight: 700;
    }

    .plate-tab-remove {
      border: 0;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 1px;
    }

    .plate-tab-remove:hover {
      color: var(--red);
    }

    .plate-tab-add {
      border: 1.5px dashed var(--border);
      background: transparent;
      color: var(--text-muted);
      padding: 6px 11px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .plate-tab-add:hover {
      border-color: var(--blue);
      color: var(--blue-dark);
    }

    .cl-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .cl-selectors label {
      display: block;
      font-size: var(--fs-2xs);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .field-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .field-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 6px 8px;
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
    }

    .field-row.active {
      border-color: var(--blue-dark);
      box-shadow: 0 0 0 2px var(--blue-border);
      background: var(--blue-bg);
    }

    .field-kind {
      font-size: var(--fs-2xs);
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
    }

    .field-name {
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      outline: none;
    }

    .field-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
    }

    .value-text-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 8px;
    }

    #overview-stage {
      display: none;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
    }

    body.overview .workspace {
      display: none;
    }

    body.overview #overview-stage {
      display: flex;
    }

    .overview-cell {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      background: var(--surface-subtle);
      padding: 12px;
      break-inside: avoid;
    }

    .overview-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .overview-cell svg {
      display: block;
    }

    @media print {
      body {
        background: #fff;
      }

      .lt-nav,
      .lt-footer,
      .layout-actions,
      .control-strip,
      .plate-tabs,
      .side-panel,
      .status-line {
        display: none !important;
      }

      .plate-stage {
        display: none !important;
      }

      #overview-stage {
        display: flex !important;
      }

      .lt-page-body {
        display: block;
        padding: 0;
      }

      .card {
        max-width: none;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
      }

      .layout-top {
        display: block;
        margin-bottom: 10px;
      }

      .lt-tool-title {
        margin-bottom: 4px;
      }

      .lt-tool-subtitle {
        margin-bottom: 12px;
      }

      .workspace {
        display: block;
      }

      .plate-stage {
        display: block;
        overflow: visible;
      }

      .plate-stage-shell {
        display: block;
        border: 0;
        background: #fff;
        padding: 0;
        width: auto;
      }

      .plate-frame {
        min-width: 0;
        --plate-frame-border: #999;
        break-inside: avoid;
      }

      .plate-shell {
        box-shadow: none;
      }

      .print-summary {
        display: block;
        font-size: 0.8rem;
        color: #333;
      }

      .print-legend {
        display: block;
      }

      .well {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

<nav class="lt-nav">
  <a class="lt-nav-brand" href="../../index.html">&#128300; LabTools</a>
  <span class="lt-nav-sep">/</span>
  <span class="lt-nav-page">Microplate Layout Planner</span>
</nav>

<div class="lt-page-body">
<div class="card">

  <div class="layout-top">
    <div>
      <h1 class="lt-tool-title">Microplate Layout Planner</h1>
      <p class="lt-tool-subtitle">Map treatment groups, sample IDs, and custom fields across one or more multi-well plates.</p>
    </div>
    <div class="layout-actions">
      <input type="file" id="import-csv-input" accept=".csv,.txt" style="display:none" />
      <button class="btn-reset" type="button" id="import-csv-btn">Import CSV</button>
      <button class="btn-reset" type="button" id="export-csv-btn">Export CSV</button>
      <button class="btn-reset" type="button" id="export-png-btn">Export PNG</button>
      <button class="btn-reset" type="button" id="view-all-btn">View All</button>
      <button class="btn-reset" type="button" id="print-btn">Print Layout</button>
      <button class="btn-reset" type="button" id="reset-btn">Reset Plate</button>
      <button class="btn-reset" type="button" id="wb-save-btn">Save to Workbench</button>
      <button class="btn-reset" type="button" id="wb-load-btn">Load from Workbench</button>
      <span id="lt-artifact-controls" style="display:inline-flex;gap:8px;flex-wrap:wrap"></span>
      <button class="btn-reset" type="button" id="wb-to-qpcr-btn" title="Save this layout and open the qPCR Analyzer with it loaded">Send to qPCR →</button>
    </div>
  </div>

  <div class="control-strip">
    <div class="field-block">
      <label class="lt-label" for="plate-type">Plate</label>
      <select class="lt-select" id="plate-type"></select>
    </div>

    <div class="field-block">
      <div class="lt-label">Orientation Corners</div>
      <div class="corner-toggles" id="corner-toggles"></div>
    </div>

    <div class="field-block">
      <div class="lt-label">Plate Summary</div>
      <div class="lt-badge lt-badge-blue" id="plate-summary">96 wells</div>
    </div>
  </div>

  <div class="plate-tabs" id="plate-tabs" aria-label="Plates"></div>

  <div class="print-summary" id="print-summary"></div>
  <div class="print-legend" id="print-legend" aria-label="Printed group legend"></div>

  <div class="workspace">
    <div class="plate-stage" id="plate-stage">
      <div class="plate-stage-shell" id="plate-stage-shell">
        <div class="plate-frame" id="plate-frame">
          <div class="plate-shell" id="plate-shell" aria-hidden="true"></div>
          <svg class="plate-outline" id="plate-outline" aria-hidden="true" focusable="false">
            <path id="plate-outline-path"></path>
          </svg>
          <div class="plate-grid" id="plate-grid" role="grid" aria-label="Well plate layout"></div>
        </div>
      </div>
    </div>

    <aside class="side-panel" aria-label="Layout controls">
      <div class="side-section">
        <div class="lt-section-label lt-section-label--tight">Selection</div>
        <div class="selection-meter">
          <div class="meter-box">
            <div class="meter-label">Wells</div>
            <div class="meter-value" id="selected-count">0</div>
          </div>
          <div class="meter-box">
            <div class="meter-label">Copied</div>
            <div class="meter-value" id="clipboard-count">0</div>
          </div>
        </div>
        <div class="button-grid">
          <button class="lt-btn lt-btn-primary" type="button" id="assign-btn">Assign</button>
          <button class="btn-reset" type="button" id="clear-btn">Clear</button>
          <button class="btn-reset" type="button" id="copy-btn">Copy</button>

const CORNERS = [

const GROUP_COLORS = [

];

const PLATE_UI_MM = {

};
const PLATE_SCALE_LIMITS = { min: 2.6, max: 6.0 };
const VIEWPORT_HEIGHT_RESERVE_PX = 96;
const PNG_EXPORT = {
  width: 1920,
  height: 1080,
  margin: 72,
  gap: 56,
  rightLegendWidth: 420,
};

// ── State ────────────────────────────────────────────────────────────────────
// Fields are shared columns across every plate (keeps the CSV consistent). Exactly
// one category field drives well color (colorFieldId). A well's data is a record
// { [fieldId]: value } where a category value is a category id and a text value is a
// string. Each plate owns its size, corner marks, and assignments.
let fields = [];                 // [{ id, name, kind: 'category'|'text' }]
let categoriesByField = {};      // fieldId -> [{ id, name, color }]
let colorFieldId = 'group';      // category field that colors wells ("Color by")
let labelFieldId = 'group';      // field whose value prints on the well face ("Label by")
let activeFieldId = 'group';     // field targeted by the assign controls
let activeCatByField = {};       // categoryFieldId -> active category id

let plates = [];                 // [{ id, name, plateType, cutCorners:Set, assignments:{} }]
let activePlateId = null;
let overviewMode = false;

let selectedWells = new Set();
let selectionAnchor = null;
let dragState = null;
let clipboard = null;
let plateFrameObserver = null;
let plateRenderRaf = 0;
let currentPlatePxPerMm = PLATE_SCALE_LIMITS.min;
let uidSeq = 1;

const els = {};

function uid(prefix) { return `${prefix}${(uidSeq++).toString(36)}${Date.now().toString(36)}`; }

function seedDefaults() {
  // `key` is the CSV column header (interop contract with qPCR: group/sample/gene);
  // `name` is the editable display label. They start aligned but can diverge.
  fields = [
    { id: 'group', key: 'group', name: 'Group', kind: 'category' },
    { id: 'sample', key: 'sample', name: 'Sample ID', kind: 'text' },
    { id: 'gene', key: 'gene', name: 'Gene', kind: 'text' },
  ];
  categoriesByField = {
    group: [
      { id: 'c1', name: 'Control', color: GROUP_COLORS[0] },
      { id: 'c2', name: 'Treatment', color: GROUP_COLORS[1] },
    ],
  };
  activeCatByField = { group: 'c1' };
  colorFieldId = 'group';
  labelFieldId = 'group';
  activeFieldId = 'group';
  plates = [makePlate('96', 'Plate 1')];
  activePlateId = plates[0].id;
}

function makePlate(plateType, name) {
  return { id: uid('p'), name: name || nextPlateName(), plateType, cutCorners: new Set(['top-left']), assignments: {} };
}

function nextPlateName() {
  let n = plates.length + 1;
  const taken = new Set(plates.map((p) => p.name));
  while (taken.has(`Plate ${n}`)) n += 1;
  return `Plate ${n}`;
}

// ── Active-plate + field accessors ───────────────────────────────────────────
function AP() { return plates.find((p) => p.id === activePlateId) || plates[0]; }
function getField(id) { return fields.find((f) => f.id === id) || null; }
function categoryFields() { return fields.filter((f) => f.kind === 'category'); }
function cats(fieldId) { return categoriesByField[fieldId] || []; }
function getCat(fieldId, catId) { return cats(fieldId).find((c) => c.id === catId) || null; }
function wellValue(plate, wellId, fieldId) {
  const rec = plate.assignments[wellId];
  return rec ? rec[fieldId] : undefined;
}
function colorForWell(plate, wellId) {
  const cat = getCat(colorFieldId, wellValue(plate, wellId, colorFieldId));
  return cat ? cat.color : '';
}
function labelForWell(plate, wellId) {
  const field = getField(labelFieldId);
  if (!field) return '';
  const value = wellValue(plate, wellId, labelFieldId);
  if (value === undefined || value === '') return '';
  return field.kind === 'category' ? (getCat(labelFieldId, value)?.name || '') : String(value);
}

document.addEventListener('DOMContentLoaded', init);

function init() {
  cacheElements();
  seedDefaults();
  setupLayoutObservers();
  renderPlateOptions();
  renderCornerToggles();
  renderAll();
  wireEvents();
}

function cacheElements() {
  els.plateType = document.getElementById('plate-type');
  els.plateSummary = document.getElementById('plate-summary');
  els.cornerToggles = document.getElementById('corner-toggles');
  els.plateStage = document.getElementById('plate-stage');
  els.plateStageShell = document.getElementById('plate-stage-shell');
  els.plateFrame = document.getElementById('plate-frame');
  els.plateShell = document.getElementById('plate-shell');
  els.plateOutline = document.getElementById('plate-outline');
  els.plateOutlinePath = document.getElementById('plate-outline-path');
  els.plateGrid = document.getElementById('plate-grid');
  els.selectedCount = document.getElementById('selected-count');
  els.clipboardCount = document.getElementById('clipboard-count');
  els.assignBtn = document.getElementById('assign-btn');
  els.clearBtn = document.getElementById('clear-btn');
  els.copyBtn = document.getElementById('copy-btn');
  els.pasteBtn = document.getElementById('paste-btn');
  els.plateTabs = document.getElementById('plate-tabs');
  els.colorBy = document.getElementById('color-by');
  els.labelBy = document.getElementById('label-by');
  els.fieldList = document.getElementById('field-list');
  els.newFieldName = document.getElementById('new-field-name');
  els.newFieldKind = document.getElementById('new-field-kind');
  els.addFieldBtn = document.getElementById('add-field-btn');
